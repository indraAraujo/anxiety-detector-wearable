version: '3.8'

services:
  hivemq:
    image: hivemq/hivemq-ce:latest
    container_name: hivemq
    restart: always
    ports:
      - "8080:8080"
      - "1883:1883"

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: always
    depends_on:
      - hivemq
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    command: ["telegraf", "--config", "${TELEGRAF_CONFIG_URL}"]